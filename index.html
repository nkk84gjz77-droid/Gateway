<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Gateway Privado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-bg { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full glass rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <div class="md:w-64 gradient-bg p-8 text-white">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                    <i class="fas fa-shield-alt text-xl"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">GATEWAY</h1>
            </div>
            
            <nav class="space-y-4">
                <a href="#" class="flex items-center gap-3 p-3 bg-white/10 rounded-xl text-blue-400 border border-white/10">
                    <i class="fas fa-qrcode"></i> Gerar Pix
                </a>
                <a href="#" class="flex items-center gap-3 p-3 text-gray-400 hover:bg-white/5 rounded-xl transition">
                    <i class="fas fa-paper-plane"></i> Transferir
                </a>
                <a href="#" class="flex items-center gap-3 p-3 text-gray-400 hover:bg-white/5 rounded-xl transition">
                    <i class="fas fa-history"></i> Histórico
                </a>
            </nav>
        </div>

        <div class="flex-1 p-8 md:p-12">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Receber Pagamento</h2>
                <span class="text-xs bg-green-100 text-green-600 px-3 py-1 rounded-full font-semibold uppercase">API Ativa</span>
            </div>

            <div class="grid md:grid-cols-2 gap-10">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">Valor do Recebimento (R$)</label>
                        <input type="number" placeholder="150.00" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-500 mb-2">Descrição (Opcional)</label>
                        <input type="text" placeholder="Venda de produto" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <button class="w-full py-4 gradient-bg text-white rounded-2xl font-bold shadow-lg shadow-blue-900/20 hover:scale-[1.02] transition-transform">
                        Gerar QR Code Dinâmico
                    </button>
                </div>

                <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-3xl p-6 bg-white">
                    <div class="w-48 h-48 bg-gray-100 rounded-2xl mb-4 flex items-center justify-center border border-gray-200 shadow-inner">
                        <i class="fas fa-qrcode text-6xl text-gray-300"></i>
                    </div>
                    <p class="text-sm text-gray-400 text-center">Aguardando geração do código...</p>
                </div>
            </div>

            <div class="mt-12 pt-8 border-t border-gray-100 grid grid-cols-2 gap-4">
                <div class="flex items-center gap-3">
                    <i class="fas fa-lock text-blue-500"></i>
                    <span class="text-xs text-gray-500">Criptografia de 256 bits ativa</span>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fas fa-check-circle text-green-500"></i>
                    <span class="text-xs text-gray-500">Conformidade PIX Banco Central</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
